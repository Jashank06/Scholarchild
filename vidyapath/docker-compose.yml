services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vidyapath-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    container_name: vidyapath-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always
